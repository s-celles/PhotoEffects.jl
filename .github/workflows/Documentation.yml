name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    name: Build docs and validate notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kahliburke/KaimonSlate.jl
          path: .ci/KaimonSlate.jl
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Instantiate documentation
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          kaimon = joinpath(pwd(), ".ci", "KaimonSlate.jl")
          Pkg.develop([
              PackageSpec(path=joinpath(kaimon, "lib", "SlateExtensionsBase")),
              PackageSpec(path=kaimon),
              PackageSpec(path=pwd()),
          ])
          Pkg.instantiate()
      - name: Build and deploy Documenter site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --color=yes --project=docs docs/make.jl
      - name: Validate documentation notebooks
        run: julia --color=yes --project=docs docs/validate.jl
